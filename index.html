<!DOCTYPE html>
<html>
	<head>
		<title>
			Eternia: Chronicles of Meranthe - Update Tracker
		</title>
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link href="changes.css" rel="stylesheet">
		<script src="changes.js" type="text/javascript"></script>
	</head>
	
	<body onload="LoadChanges()">
		<div class="contentContainer">
			<div class="titleHeader">
				<span class="titleGame">
					Chronicles of Meranthe
				</span>
				<span class="titleSub">
					Update Tracker
				</span>
			</div>
			<div class="changeHeader versionHeader">
				<div class="changeVersions" id="changeVersions">
					<span class="changeLabel">
						Version:
					</span>
				</div>
			</div>
			<div class="changeHeader dateHeader">
				<div class="changeDates" id="changeDates">
					<span class="changeLabel">
						Date:
					</span>
					<span class="changeDate">
						<select name="changeDate" id="changeDate" class="changeDate" onchange="DateChanged()">
						</select>
					</span>
				</div>
			</div>
			<div class="changeHeader changeSearch" id="changeSearch">
				<div class="changeDates">
					<span class="changeLabel">
						Search:
					</span>
					<span class="changeSearchBox">
						<input type="text" class="changeSearchInput" id="changeSearchInput" oninput="SearchSubmit()">
					</span>
				</div>
			</div>
			<div class="changeHeader changeContent" id="changeContent">
			</div>
			<div class="changeFooter">
				<a href='https://ko-fi.com/E7N027BGMI' target='_blank'><img class="supportImage" src='https://storage.ko-fi.com/cdn/kofi2.png?v=6' alt='Buy Me a Coffee at ko-fi.com' /></a>
			</div>
			
			<div class="changeAuthor">
				Tracker by <a href="https://github.com/Nadrew" class="footerLink">Nadrew</a>
			</div>
			
		</div>
	</body>
